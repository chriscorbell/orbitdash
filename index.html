<!doctype html>
<html lang="en" class="dark" data-accent="ice">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/orbitdash.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c10" />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colors.
      (function () {
        try {
          var cached = JSON.parse(localStorage.getItem("orbitdash.settingsCache") || "{}");
          var appearance = cached.appearance || {};
          var theme = appearance.theme || "dark";
          var dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          if (appearance.accent) root.dataset.accent = appearance.accent;
        } catch (error) {
          // Keep the defaults on the <html> element.
        }
      })();
    </script>
    <title>orbitdash</title>
    <!-- Installable app. use-credentials lets the manifest load behind an auth proxy. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="orbitdash" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
