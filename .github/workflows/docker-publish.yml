name: Deploy to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - ".github/images/**"
      - ".vscode/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restrict manual publishing refs
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" && "$REF" != refs/tags/v* ]]; then
            echo "Manual publishing is limited to main or v* tags." >&2
            exit 1
          fi

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Release tag $TAG does not match package version $VERSION." >&2
            exit 1
          fi

  validate:
    needs: authorize
    uses: ./.github/workflows/test.yml

  prepare:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

  build-amd64:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke test image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: orbitdash:ci
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=linux-amd64

      - name: Smoke test container readiness
        run: |
          docker run -d --rm --name orbitdash-ci -p 38080:3000 orbitdash:ci
          trap 'docker logs orbitdash-ci; docker rm -f orbitdash-ci >/dev/null 2>&1 || true' EXIT
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 1 \
            http://127.0.0.1:38080/readyz

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested amd64 image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v6
        with:
          name: digests-linux-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke test image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          tags: orbitdash:ci
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=linux-arm64

      - name: Smoke test container readiness
        run: |
          docker run -d --rm --name orbitdash-ci -p 38080:3000 orbitdash:ci
          trap 'docker logs orbitdash-ci; docker rm -f orbitdash-ci >/dev/null 2>&1 || true' EXIT
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 1 \
            http://127.0.0.1:38080/readyz

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=linux-arm64
          cache-to: type=gha,mode=max,scope=linux-arm64
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v6
        with:
          name: digests-linux-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - prepare
      - build-amd64
      - build-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digest artifacts
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create multi-platform manifest
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          digest_refs=()
          for digest_path in /tmp/digests/*; do
            digest="$(basename "$digest_path")"
            digest_refs+=("${{ env.REGISTRY_IMAGE }}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
